{% set version = "0.4.0" %}
{% set name = "pydelatin" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d0ab7bd372582c89f3ce1d50214e571c565364ff7b2e3ca883638ca004d63355

build:
  number: 0
  skip: true  # [py<36] [python_impl == 'pypy']
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - numpy
    - pybind11 >=2.5.0
    - glm
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - pydelatin

about:
  home: https://github.com/kylebarron/pydelatin
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python bindings to hmm for fast terrain mesh generation
  description: |
    A Python wrapper of hmm (of which Delatin is a port) for fast terrain mesh generation.
  doc_url: https://github.com/kylebarron/pydelatin
  dev_url: https://github.com/kylebarron/pydelatin

extra:
  recipe-maintainers:
    - davidbrochart
    - kylebarron
